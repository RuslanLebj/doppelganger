[project]
name = "doppelganger"
version = "0.1.0"
description = "Ночные резервные копии PostgreSQL: локально и в S3."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18,<2",
    "apscheduler>=3.11,<4",
    "boto3>=1.40,<2",
    "cryptography>=48,<49",
    "fastapi>=0.136,<0.137",
    "granian>=2.7,<3",
    "pydantic-settings>=2.12,<3",
    "psycopg[binary]>=3.3,<4",
    "sqlalchemy>=2.0.45,<2.1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.32,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<0.29", "pytest>=9,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
